<title>CareHouse One Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell = fixed left sidebar + top bar + scrolling work area; phone = bottom nav + floating quick action */
:root{
  --bg:#EDF3F4; --surface:#FFFFFF; --surface-2:#F5F9FA; --ink:#13303A; --ink-2:#4B6770; --line:#D3E0E3;
  --accent:#1D6884; --accent-soft:#DAECF2; --on-accent:#FFFFFF; --sage:#3C7C60; --sage-soft:#DFEFE6;
  --ok:#25744A; --ok-soft:#DCF0E3; --warn:#8C6200; --warn-soft:#FAEDC8; --crit:#B23D17; --crit-soft:#FAE1D6;
  --iso-c:#9C5D00; --iso-d:#1E5BAA; --iso-a:#B02219; --iso-e:#6A43AC;
  --side-bg:#113642; --side-ink:#C9DFE6; --side-on:#24566A; --side-mark:#3E93B2; --side-dot:#7FD0B0;
  --scrim:rgba(8,24,30,.45);
  --shadow:0 1px 2px rgba(19,48,58,.06),0 8px 24px rgba(19,48,58,.10);
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D191E; --surface:#14242B; --surface-2:#1A2D35; --ink:#E3EDF0; --ink-2:#9BB3BB; --line:#2A3F48;
  --accent:#6DB6D1; --accent-soft:#183946; --on-accent:#0D191E; --sage:#7AC19E; --sage-soft:#16392B;
  --ok:#6BCA91; --ok-soft:#133628; --warn:#E6BA50; --warn-soft:#382D10; --crit:#F0896A; --crit-soft:#40231A;
  --iso-c:#E3A040; --iso-d:#71A9EF; --iso-a:#F07569; --iso-e:#B497EA;
  --side-bg:#0A1519; --side-ink:#AFC7CF; --side-on:#1C3A46; --side-mark:#2C7894; --side-dot:#7AC19E;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D191E; --surface:#14242B; --surface-2:#1A2D35; --ink:#E3EDF0; --ink-2:#9BB3BB; --line:#2A3F48;
  --accent:#6DB6D1; --accent-soft:#183946; --on-accent:#0D191E; --sage:#7AC19E; --sage-soft:#16392B;
  --ok:#6BCA91; --ok-soft:#133628; --warn:#E6BA50; --warn-soft:#382D10; --crit:#F0896A; --crit-soft:#40231A;
  --iso-c:#E3A040; --iso-d:#71A9EF; --iso-a:#F07569; --iso-e:#B497EA;
  --side-bg:#0A1519; --side-ink:#AFC7CF; --side-on:#1C3A46; --side-mark:#2C7894; --side-dot:#7AC19E;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr)}
.side{background:var(--side-bg);color:var(--side-ink);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;font:600 16px var(--f-display);color:#fff;padding:2px 6px 14px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--side-mark);display:grid;place-items:center;flex:none}
.mark svg{width:17px;height:17px}
.side .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;padding:10px 10px 4px}
.nv{all:unset;box-sizing:border-box;padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px}
.nv::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.45;flex:none}
.nv:hover{background:color-mix(in srgb,var(--side-on) 60%,transparent)}
.nv:focus-visible{outline:2px solid var(--side-dot)}
.nv.on{background:var(--side-on);color:#fff;font-weight:700}
.nv.on::before{opacity:1;background:var(--side-dot)}
.nv em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:#C2491E;color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.nsec{display:grid;gap:1px}
.nsh{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:14px 10px 5px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--side-ink);opacity:.7;cursor:pointer;border-radius:6px}
.nsh:hover{opacity:1}
.nsh:focus-visible{outline:2px solid var(--side-dot);opacity:1}
.nsh i{margin-left:auto;font-style:normal;font-size:14px;font-weight:400;width:14px;text-align:center}
.nsh em{font-style:normal;font-size:10px;letter-spacing:0;background:#C2491E;color:#fff;border-radius:999px;padding:0 6px;line-height:16px}
.nsb{display:grid;gap:1px}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:12px 10px 0;line-height:1.4}

.shell{display:flex;flex-direction:column;min-width:0;height:100%}
.topb{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:nowrap}
.scopesel{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:700;background:var(--surface-2);max-width:230px}
.search{flex:1;max-width:340px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--surface-2)}
.sp{flex:1}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 11px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib b{background:var(--crit);color:var(--surface);border-radius:999px;padding:0 6px;font-size:11px}
.av{width:34px;height:34px;border-radius:50%;background:var(--sage-soft);color:var(--sage);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;border:0}
.demo{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sage);border:1px dashed var(--sage);border-radius:999px;padding:2px 8px;white-space:nowrap}

main{flex:1;overflow:auto;padding:20px;display:block}
.pg{display:grid;gap:14px;max-width:1360px;margin:0 auto;padding-bottom:90px}
.hrow{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.hrow h1{font-size:24px;font-weight:600}
.crumb{font-size:13px;color:var(--ink-2)}
.crumb button{all:unset;cursor:pointer;color:var(--accent);font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kp{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:3px;align-content:start}
button.kp{cursor:pointer}
button.kp:hover{border-color:var(--accent)}
.kp small{color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kp b{font:600 24px var(--f-display);font-variant-numeric:tabular-nums}
.kp span{font-size:12.5px;color:var(--ink-2)}
.kp.alert{border-color:var(--crit);box-shadow:inset 4px 0 0 var(--crit)}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.cd h2{font:600 12px var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cd h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:400}
.g21{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
@media (max-width:1100px){.g21,.g12,.g3{grid-template-columns:minmax(0,1fr)}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 9px 1px 7px;border-radius:999px;font-size:12px;font-weight:700;line-height:21px;white-space:nowrap;border:0}
.pill i{width:8px;height:8px;display:inline-block;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ok i{border-radius:50%}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.warn i{width:7px;height:7px;transform:rotate(45deg)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.crit i{width:10px;height:9px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.pill.info{background:var(--accent-soft);color:var(--accent)} .pill.info i{border-radius:2px}
.pill.mute{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)} .pill.mute i{background:transparent;border:1.5px solid currentColor;border-radius:50%}
button.pill{cursor:pointer}
button.pill:hover{filter:brightness(.95);box-shadow:inset 0 0 0 1.5px currentColor}
.iso{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font:700 12px/1 var(--f-display);border:2px solid currentColor;background:var(--surface);flex:none}
.iso.c{color:var(--iso-c)} .iso.d{color:var(--iso-d);border-style:dashed} .iso.a{color:var(--iso-a);border-style:double;border-width:3px} .iso.e{color:var(--iso-e);border-style:dotted}
.isos{display:inline-flex;gap:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:7px 13px;font-weight:700;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{background:var(--crit);color:var(--surface);border-color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.big{width:100%;padding:14px;font:600 16px var(--f-display);border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.tw{overflow-x:auto}
.mt{border-collapse:collapse;width:100%;font-size:13.5px}
.mt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.mt td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.mt tr:last-child td{border-bottom:0}
.mt tr.click{cursor:pointer}
.mt tr.click:hover td{background:var(--surface-2)}
.bar{height:7px;border-radius:4px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;min-width:56px}
.bar span{display:block;height:100%;background:var(--sage)}
.feed{display:grid;gap:7px}
.fi{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 10px;border-radius:9px;background:var(--surface-2);cursor:pointer;font-size:13.5px}
.fi:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.fi small{color:var(--ink-2);font-size:12px;display:block}
.fi .t{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);font-size:13.5px;text-align:center}

.heat{display:grid;grid-template-columns:100px repeat(5,minmax(0,1fr));gap:3px;font-size:12px;font-variant-numeric:tabular-nums}
.heat div{padding:6px 4px;text-align:center;border-radius:5px}
.heat .hd{color:var(--ink-2);font-weight:700;font-size:10.5px;text-transform:uppercase}
.heat .fn{text-align:left;font-weight:700}
.h-ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.h-warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.h-crit{background:var(--crit-soft);color:var(--crit);font-weight:700}

.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit);font-weight:700;flex-wrap:wrap}
.banner span{font-weight:400;color:var(--ink)}
.banner .btn{margin-left:auto}

.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px}
@media (max-width:560px){.plan{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rm{all:unset;box-sizing:border-box;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 9px;min-height:78px;display:grid;gap:4px;align-content:start;font-size:12.5px;cursor:pointer}
.rm:hover{border-color:var(--accent)}
.rm .no{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.rm b{font-size:14px}
.rm.iso-on{border-color:var(--iso-c);background:color-mix(in srgb,var(--iso-c) 9%,var(--surface))}
.rm.vac{cursor:default;background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px);color:var(--ink-2)}
.rm.common{grid-column:span 2;background:var(--surface-2);border-style:dashed;color:var(--ink-2);cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}

.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rc{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;cursor:pointer;align-content:start}
.rc:hover{border-color:var(--accent)}
.ph{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),var(--sage-soft));display:grid;place-items:center;font:600 17px var(--f-display);color:var(--accent);flex:none}
.ph.lg{width:72px;height:72px;border-radius:16px;font-size:24px}
.rc .nm{font:600 15px var(--f-display);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rc small{color:var(--ink-2);font-size:12.5px;display:block}
.rc .chips{grid-column:1/-1}

.rhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
@media (max-width:700px){.rhead{grid-template-columns:auto minmax(0,1fr)}.rhead .acts{grid-column:1/-1;justify-content:flex-start!important}}
.rname{font:600 22px var(--f-display)}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-2);font-size:13px}
.facts b{color:var(--ink)}
.allergy{display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:10px;background:var(--crit-soft);color:var(--crit);font-weight:700;font-size:13.5px;flex-wrap:wrap}
.allergy span{color:var(--ink);font-weight:400}
.allergy.none{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 13px;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tl{display:grid}
.tl>div{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13.5px}
.tl>div:last-child{border-bottom:0}
.tl time{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.goal{display:grid;gap:5px;font-size:13px}
.goal div{display:flex;justify-content:space-between;gap:8px}
.note{display:grid;gap:4px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.note small{color:var(--ink-2)}
svg.spark polyline{fill:none;stroke:var(--accent);stroke-width:2}
svg.spark .band{fill:var(--ok-soft)}
svg.spark circle{fill:var(--accent)}

.emar{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px}
@media (max-width:900px){.emar{grid-template-columns:minmax(0,1fr)}}
.rlist{display:grid;gap:4px}
.rl{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 9px;border-radius:9px;cursor:pointer;font-size:13.5px}
.rl:hover{background:var(--surface-2)}
.rl.on{background:var(--accent-soft)}
.rl small{color:var(--ink-2);display:block;font-size:12px}
.rl .av{width:24px;height:24px;font-size:10px}
.mar{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:640px}
.mar th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);padding:7px;border-bottom:1px solid var(--line);text-align:center;font-weight:700}
.mar th:first-child{text-align:left}
.mar th.now{color:var(--accent);background:var(--accent-soft);border-radius:7px 7px 0 0}
.mar td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.mar td:first-child{text-align:left}
.mar td.now{background:var(--accent-soft)}
.mar .med b{display:block;font-size:13.5px}
.mar .med small{color:var(--ink-2)}
.ctl{font:700 10px var(--f-display);color:var(--iso-e);border:1.5px solid var(--iso-e);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:middle}

.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.lanes{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px;display:grid;gap:7px;align-content:start}
.lane>b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);display:flex;justify-content:space-between}
.case{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 9px;display:grid;gap:4px;font-size:13px;cursor:pointer}
.case:hover{border-color:var(--accent)}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.case small{color:var(--ink-2)}
.ppe{display:grid;gap:9px;font-size:13px}
.ppe>div{display:grid;grid-template-columns:110px minmax(0,1fr) 62px auto;gap:8px;align-items:center}
.ppe .bar span.lo{background:var(--crit)}
.ppe .bar span.md{background:var(--warn)}
.ck{display:grid;gap:6px;font-size:13px}
.ck>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
svg.chart text{fill:var(--ink-2);font-family:var(--f-body);font-size:10px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .res{fill:var(--accent)}
svg.chart .stf{fill:var(--sage)}
svg.chart .mk{stroke:var(--crit);stroke-width:1.5;stroke-dasharray:4 3}
svg.chart text.mkt{fill:var(--crit);font-weight:700}

.rep{display:grid;grid-template-columns:210px minmax(0,1fr) 260px;gap:14px}
@media (max-width:1150px){.rep{grid-template-columns:minmax(0,1fr)}}
.lib{display:grid;gap:2px;font-size:13.5px}
.lib b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);padding:9px 8px 3px}
.lib button{all:unset;cursor:pointer;padding:6px 9px;border-radius:8px}
.lib button:hover{background:var(--surface-2)}
.lib button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;background:var(--surface-2);font-size:13px}
.filt label{color:var(--ink-2)}
.filt select{border:0;background:transparent;font-weight:700;padding:2px 4px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.hbar .bar{height:16px;border-radius:5px}
.hbar .bar span{background:var(--accent)}
.hbar .bar span.w{background:var(--warn)}
.audit{font-family:var(--f-mono);font-size:12px;display:grid;gap:5px;color:var(--ink-2)}
.audit div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px}
.menu{position:relative;display:inline-block}
.menu .list{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:grid;padding:4px;z-index:5;min-width:150px}
.menu .list button{all:unset;cursor:pointer;padding:7px 10px;border-radius:7px;font-weight:700;font-size:13px}
.menu .list button:hover{background:var(--surface-2)}

/* overlays */
.fab{position:fixed;right:24px;bottom:24px;z-index:20;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 18px 12px 13px;font-weight:700;font-size:15px;box-shadow:var(--shadow)}
.fab b{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px;line-height:1}
.dialscrim{position:fixed;inset:0;background:var(--scrim);z-index:18}
.dial{position:fixed;right:24px;bottom:84px;z-index:19;display:grid;gap:8px;justify-items:end}
.dial button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;box-shadow:var(--shadow);font-size:14px}
.dial button:hover{border-color:var(--accent);color:var(--accent)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:31;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header,.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h2,.modal header h2{font-size:18px;font-weight:600;flex:1}
.x{border:0;background:var(--surface-2);border-radius:8px;width:34px;height:34px;font-size:18px;color:var(--ink-2)}
.drawer .body,.modal .body{padding:16px 18px;overflow:auto;display:grid;gap:12px;align-content:start}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 32px));max-height:calc(100% - 40px);background:var(--surface);z-index:31;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:grid;gap:5px;font-size:13.5px}
.field label,.field .lab{font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface-2);width:100%}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface-2);font-weight:700;font-size:13.5px;cursor:pointer}
.opt input{margin:0;width:18px;height:18px;accent-color:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.steps span.done{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.steps span.cur{background:var(--accent);color:var(--on-accent);box-shadow:none}
.stop{border:2px solid var(--crit);background:var(--crit-soft);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.stop b{color:var(--crit);font-family:var(--f-display)}
.okbox{border:1px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px 14px}
.who{display:flex;gap:12px;align-items:center}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:40;display:grid;gap:8px;width:min(520px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:14px}
.toast.crit{background:var(--crit)}
.toast button{margin-left:auto;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:4px 10px;font-weight:700;white-space:nowrap}
.bnav{display:none}
@media (max-width:1180px){.demo{display:none}}
@media (max-width:960px){.clock{display:none}.search{max-width:200px}}

/* messaging */
.msg{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;height:min(700px,calc(100dvh - 190px));min-height:440px}
.tlistc{display:flex;flex-direction:column;min-height:0;gap:10px}
.tlist{overflow:auto;display:grid;gap:4px;align-content:start;min-height:0}
.th{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;padding:10px 11px;border-radius:10px;font-size:14px}
.th:hover{background:var(--surface-2)}
.th.on{background:var(--accent-soft)}
.th .tt{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.th .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .tm{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.th .pv{grid-column:1/-1;color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .kd{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.convo{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden;gap:0}
.convo>header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.convo>header b{font:600 16px var(--f-display)}
#conv{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.bub{max-width:min(78%,560px);padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--surface-2);font-size:14px;display:grid;gap:3px;align-self:flex-start;box-shadow:inset 0 0 0 1px var(--line)}
.bub.mine{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--accent-soft);box-shadow:none}
.bub small{color:var(--ink-2);font-size:11.5px}
.daysep{align-self:center;font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.compose{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.compose textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface-2);resize:none;min-height:46px;max-height:140px;width:100%}
.fnote{margin:10px 14px 0;padding:8px 12px;border-radius:9px;background:var(--warn-soft);font-size:12.5px}
.back{display:none}
@media (max-width:760px){.msg{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 210px)}.msg.conv .tlistc{display:none}.msg:not(.conv) .convo{display:none}.back{display:inline-flex}}

/* documents & templates */
.tplg{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
@media (max-width:1000px){.tplg{grid-template-columns:minmax(0,1fr)}}
.tli{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;padding:10px 11px;border-radius:10px;font-size:14px}
.tli:hover{background:var(--surface-2)}
.tli.on{background:var(--accent-soft)}
.tli small{color:var(--ink-2);font-size:12.5px}
.tli .chips{gap:4px}
.diff{display:grid;gap:6px;font-size:14px}
.diff div{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;padding:7px 10px;border-radius:8px;background:var(--surface-2)}
.diff b{font-family:var(--f-mono);text-align:center;border-radius:5px;line-height:20px}
.diff .add b{background:var(--ok-soft);color:var(--ok)}
.diff .rem b{background:var(--crit-soft);color:var(--crit)}
.diff .chg b{background:var(--warn-soft);color:var(--warn)}
.sect{display:grid;gap:4px;font-size:14px}
.sect b{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--sage);text-transform:uppercase;letter-spacing:.05em}
.sect ul{margin:0;padding-left:18px;display:grid;gap:3px}
.ackbar{display:grid;grid-template-columns:minmax(60px,1fr) auto;gap:8px;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:120px}
.mine-ack{display:grid;gap:8px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent)}
.mine-ack b{font-family:var(--f-display);color:var(--accent)}

/* settings & billing */
html.floor .pg{zoom:1.14}
.setg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;align-items:start}
.shr select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface-2);max-width:200px}
.lock{font-size:11.5px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.rolesg{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px}
@media (max-width:900px){.rolesg{grid-template-columns:minmax(0,1fr)}}
.meter{display:grid;gap:5px;font-size:13.5px}
.meter div:first-child{display:flex;justify-content:space-between;gap:8px}
.money{font:600 30px var(--f-display);font-variant-numeric:tabular-nums}
.mt td.num,.mt th.num{text-align:right}
.login{border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:22px;display:grid;gap:10px;justify-items:center;text-align:center;max-width:340px;width:100%;margin:0 auto}
.login .lg{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;font:600 18px var(--f-display)}
.login .fake{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--surface);color:var(--ink-2);text-align:left;font-size:13px}
.login .go{width:100%;border-radius:8px;padding:10px;color:#fff;font-weight:700}
.swatch{width:34px;height:34px;border-radius:9px;border:3px solid transparent;cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink)}

/* scheduling */
.sched{border-collapse:separate;border-spacing:0;width:100%;min-width:1000px;font-size:13px}
.sched th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-weight:700;vertical-align:bottom}
.sched td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;width:12%}
.sched td:first-child{width:auto;min-width:180px;padding-left:8px}
.sched th.today,.sched td.today{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.sched tr.cov td{background:var(--surface-2)}
.sched tr.cov td.today{background:color-mix(in srgb,var(--accent) 10%,var(--surface-2))}
.sched tr.openrow td{background:color-mix(in srgb,var(--warn) 8%,transparent)}
.sched td small{font-size:11.5px}
.sh{all:unset;box-sizing:border-box;display:grid;gap:1px;width:100%;border-radius:8px;padding:5px 7px;font-size:12px;line-height:1.25;cursor:pointer}
.sh+.sh{margin-top:4px}
.sh small{font-size:11px;font-weight:400}
.sh.D{background:var(--sage-soft);color:var(--sage)}
.sh.E{background:var(--accent-soft);color:var(--accent)}
.sh.N{background:color-mix(in srgb,var(--iso-e) 14%,var(--surface));color:var(--iso-e)}
.sh.draft{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.sh.sick{background:var(--crit-soft);color:var(--crit)}
.sh.away{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.sh.open{background:var(--surface);color:var(--warn);outline:1.5px dashed var(--warn);outline-offset:-1.5px}
span.sh{cursor:default}
.sh:focus-visible{outline:3px solid var(--accent)}
.addc{all:unset;box-sizing:border-box;display:grid;place-items:center;width:100%;min-height:40px;border-radius:8px;color:transparent;cursor:pointer;font-weight:700;font-size:16px}
.addc:hover,.addc:focus-visible{color:var(--accent);outline:1.5px dashed var(--line);outline-offset:-1.5px}
.cands{display:grid;gap:6px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.cand small{display:block;color:var(--ink-2);font-size:12px}
.myday{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.myday:last-child{border-bottom:0}
.myday time{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}

/* incident detail */
.flowbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.flowbar span{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;color:var(--ink-2)}
.flowbar span b{font:600 13.5px var(--f-display)}
.flowbar span.done{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.flowbar span.cur{background:var(--accent);color:var(--on-accent);box-shadow:none}
@media (max-width:560px){.flowbar{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gate{display:grid;gap:4px;font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.gate div{display:flex;gap:8px;align-items:center}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph-t{display:grid;gap:4px;font-size:11.5px;color:var(--ink-2)}
.ph-t img,.ph-t .ph-ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;background:linear-gradient(135deg,var(--accent-soft),var(--sage-soft));box-shadow:inset 0 0 0 1px var(--line)}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--surface-2);font-size:14px}
.act small{display:block;color:var(--ink-2);font-size:12px}
.act.done span{text-decoration:line-through;text-decoration-color:var(--ink-2)}
.ck-b{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;color:var(--ok);padding:0}
.ck-b[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok)}
.addline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.addline input{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surface-2);width:100%}
.clock-big{font:600 22px var(--f-display);font-variant-numeric:tabular-nums}

/* care plan editor */
.cpg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:1050px){.cpg{grid-template-columns:minmax(0,1fr)}}
.cpi{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface-2);width:100%;min-width:0;font-size:13.5px}
.cpi:disabled{opacity:.75;background:var(--surface)}
input.cpi.ti{font:600 17px var(--f-display)}
.grow,.irow{display:grid;gap:6px;align-items:center}
.grow{grid-template-columns:minmax(0,1fr) 120px 170px auto}
.irow{grid-template-columns:minmax(0,1fr) 130px 170px auto auto}
.grow .rng{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:6px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.grow input[type=range]{accent-color:var(--sage);width:100%}
.colh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
@media (max-width:760px){.grow,.irow{grid-template-columns:1fr 1fr}.grow>:first-child,.irow>:first-child{grid-column:1/-1}.colh{display:none}}
.tsk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tsk input{accent-color:var(--accent);width:16px;height:16px}
.xb{border:0;background:transparent;color:var(--ink-2);font-size:18px;width:30px;height:30px;border-radius:7px}
.xb:hover{background:var(--crit-soft);color:var(--crit)}
.ivw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.ivw:last-child{border-bottom:0}
.ivw .chips{gap:4px;justify-content:flex-end}
.srcb{font-size:11.5px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.srcb.req{color:var(--warn);border-color:var(--warn)}
.outl button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;font-size:13.5px}
.outl button:hover{background:var(--surface-2)}
.prefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.prefs ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}

/* daily living */
.adl{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:13px}
.adl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-weight:700}
.adl td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top}
.adl td:first-child{min-width:170px;padding-left:8px}
.lc{all:unset;box-sizing:border-box;display:grid;gap:2px;width:100%;min-height:44px;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px;line-height:1.3;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.lc:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.lc:focus-visible{outline:3px solid var(--accent)}
.lc b{font-size:12px}
.lc.ok{background:var(--ok-soft);box-shadow:none;color:var(--ok)}
.lc.part{background:var(--warn-soft);box-shadow:none;color:var(--warn)}
.lc.ref{background:var(--crit-soft);box-shadow:none;color:var(--crit)}
.lc.due{color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.lc.later{color:var(--ink-2)}
.lc span{color:var(--ink)}
.lc.out{cursor:default;color:var(--ink-2)}
.tk{all:unset;box-sizing:border-box;display:grid;grid-template-columns:24px 54px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;width:100%}
.tk:last-child{border-bottom:0}
.tk:hover{background:var(--surface-2)}
.tk:focus-visible{outline:3px solid var(--accent)}
.tk .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--ok);background:var(--surface)}
.tk.done .bx{background:var(--ok-soft);border-color:var(--ok)}
.tk.done .tx{color:var(--ink-2);text-decoration:line-through}
.tk time{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tk small{display:block;color:var(--ink-2);font-size:12px;text-decoration:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:6px;min-width:930px}
.cal .dh{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);padding:6px 4px;border-bottom:1px solid var(--line)}
.cal .dh.today{color:var(--accent)}
.cal .dc{display:grid;gap:6px;align-content:start;min-height:120px;padding:4px;border-radius:9px}
