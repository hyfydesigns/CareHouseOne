<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · CareHouse One</title>
<style>
  :root { --bg: #edf3f4; --surface: #fff; --ink: #13303a; --ink-2: #4b6770; --line: #d3e0e3; --accent: #1d6884; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d191e; --surface: #14242b; --ink: #e3edf0; --ink-2: #9bb3bb; --line: #2a3f48; --accent: #6db6d1; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--ink-2); }
  button { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>No connection</h1>
    <p>This page needs the internet to open. If you were already on the vital signs or progress notes page, go back to it: entries you save there while offline are kept on this tablet and sent later.</p>
    <p>Medications can't be recorded offline. Follow the home's downtime procedure.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
